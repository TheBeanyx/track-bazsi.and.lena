<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W62362 Élő Követés</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh; /* Teljes képernyős térkép */
        }
        #status-panel {
            position: absolute;
            top: 20px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            max-width: 300px;
        }
        h3 { margin: 0 0 10px 0; color: #1a252f; }
        p { margin: 5px 0; font-size: 14px; }
    </style>
</head>
<body>

    <div id="status-panel">
        <h3>Járat: W62362</h3>
        <p id="flight-status">Keresés a légtérben...</p>
        <p id="flight-info"></p>
    </div>

    <div id="map"></div>

    <script>
        // 1. Saját térkép létrehozása (Alapértelmezetten Európa közepe)
        const map = L.map('map').setView([47.5, 19.0], 5);

        // Ingyenes, tiszta térkép dizájn (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let planeMarker = null;
        const flightNumber = "W62362";

        // Egyedi repülőgép ikon beállítása
        const planeIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/61/61212.png', // Repülő ikon
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });

        // 2. Adatok lekérése a nyílt élő légtér API-ból
        async function trackFlight() {
            try {
                // Élő adatok lekérése a publikus ADS-B adatbázisból proxy-n keresztül
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://opendata.adsbexchange.com/api/v2/autocomplete?q=' + flightNumber)}`);
                
                // Mivel a fenti egy általános nyílt elérés, ha a gép épp a levegőben van, egy alternatív stabil nyílt forrás (OpenSky) koordinátáit használjuk szimulálva vagy élesben:
                const testResponse = await fetch('https://opensky-network.org/api/states/all');
                const data = await testResponse.json();
                
                // Megkeressük a Wizz Air gépet (W6 / WZZ hívójellel indítva)
                // Megjegyzés: A járatok csak akkor jelennek meg a térképen, ha ÉPPEN A LEVEGŐBEN VANNAK.
                let targetFlight = data.states.find(flight => flight[1] && flight[1].trim().includes("WZZ2362") || flight[1].trim().includes("W62362"));

                if (targetFlight) {
                    const lat = targetFlight[6];
                    const lon = targetFlight[5];
                    const velocity = Math.round(targetFlight[9] * 3.6); // m/s-ból km/h
                    const altitude = Math.round(targetFlight[7]); // méter

                    document.getElementById('flight-status').innerHTML = "🔴 <strong>ÉLŐBEN A LEVEGŐBEN</strong>";
                    document.getElementById('flight-info').innerHTML = `Sebesség: ${velocity} km/h<br>Magasság: ${altitude} m`;

                    // Ha még nincs ikon a térképen, lerakjuk, ha van, csak frissítjük a helyét
                    if (!planeMarker) {
                        planeMarker = L.marker([lat, lon], {icon: planeIcon}).addTo(map);
                        map.setView([lat, lon], 7); // Ráközelítünk a gépre
                    } else {
                        planeMarker.setLatLng([lat, lon]);
                    }
                } else {
                    // Ha a gép épp a földön áll és nem repül
                    document.getElementById('flight-status').innerHTML = "⚪ A járat jelenleg nem repül.";
                    document.getElementById('flight-info').innerHTML = "A gép csak akkor jelenik meg a saját térképeden, ha épp a levegőben van.";
                    
                    // DEMO MÓD: Ha ki akarod próbálni hogyan néz ki amikor repül, vedd ki a megjegyzést az alábbi sorokból:
                    /*
                    const demoLat = 47.4979; const demoLon = 19.0402;
                    if (!planeMarker) { planeMarker = L.marker([demoLat, demoLon], {icon: planeIcon}).addTo(map); map.setView([demoLat, demoLon], 6); }
                    document.getElementById('flight-status').innerHTML = "🔵 DEMO MÓD (Budapest felett)";
                    */
                }
            } catch (error) {
                console.error("Hiba történt az adatok lekérésekor:", error);
                document.getElementById('flight-status').innerHTML = "⚠️ Adatlekérési hiba. Újrapróbálkozás...";
            }
        }

        // Futtatás azonnal, majd minden 30 másodpercben újra
        trackFlight();
        setInterval(trackFlight, 30000);
    </script>
</body>
</html>
