<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W62362 Élő Követés</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
        #status-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 280px;
            border-left: 5px solid #2ecc71;
        }
        h3 { margin: 0 0 10px 0; color: #1a252f; }
        p { margin: 8px 0; font-size: 14px; color: #34495e; }
        .timer { font-weight: bold; color: #e74c3c; }
        .status-ok { color: #2ecc71; font-weight: bold; }
        .status-wait { color: #f39c12; font-weight: bold; }
    </style>
</head>
<body>

    <div id="status-panel">
        <h3>Járat: W62362</h3>
        <p id="radar-status">🔌 Radar kapcsolat: <span class="status-ok">RENDBEN</span></p>
        <p id="flight-status">⏳ Állapot: <span class="status-wait">Várakozás a felszállásra...</span></p>
        <p id="countdown-wrapper">Tervezett indulásig: <span id="countdown" class="timer">--:--:--</span></p>
        <p id="flight-info">A gép adatai felszállás után jelennek meg itt.</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
        <p style="font-size: 11px; color: #7f8c8d;" id="last-update">Utolsó ellenőrzés: --:--:--</p>
    </div>

    <div id="map"></div>

    <script>
        // Térkép létrehozása Közép-Európára fókuszálva
        const map = L.map('map').setView([47.5, 19.0], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let planeMarker = null;
        const flightCallsign = "WZZ2362"; // A W62362 járat hivatalos radar-hívójele (Wizz Air)

        const planeIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/61/61212.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });

        // Pontos visszaszámláló 16:00-ig
        function updateCountdown() {
            const now = new Date();
            const departure = new Date();
            departure.setHours(16, 0, 0, 0);

            const diff = departure - now;

            if (diff > 0) {
                const hours = Math.floor(diff / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById('countdown').innerHTML = `${hours}ó ${mins}p ${secs}mp`;
            } else {
                document.getElementById('countdown-wrapper').innerHTML = "✈️ Elérkezett az indulási idő, figyeljük a felszállást...";
            }
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Közvetlen, CORS-barát nyílt radar API hívása
        async function trackFlight() {
            const now = new Date();
            document.getElementById('last-update').innerHTML = `Utolsó ellenőrzés: ${now.toLocaleTimeString()}`;
            document.getElementById('radar-status').innerHTML = '🔌 Radar kapcsolat: <span class="status-ok">RENDBEN</span>';

            try {
                // Az adsb.fi egy teljesen nyílt, CORS-barát közösségi radarchálózat
                const response = await fetch('https://api.adsb.fi/v1/callsign/' + flightCallsign);
                
                if (!response.ok) {
                    // Ha a szerver 404-et ad vissza, az ebben az API-ban azt jelenti, hogy a gép jelenleg nem repül (nincs a levegőben)
                    document.getElementById('flight-status').innerHTML = '⏳ Állapot: <span class="status-wait">A gép még a földön áll</span>';
                    return;
                }

                const data = await response.json();
                
                if (data && data.aircraft) {
                    const aircraft = data.aircraft;
                    const lat = aircraft.lat;
                    const lon = aircraft.lon;
                    const speed = Math.round(aircraft.spd * 1.852); // Csomóból km/h-ba
                    const alt = Math.round(aircraft.alt * 0.3048); // Lábból méterbe

                    document.getElementById('flight-status').innerHTML = "🔴 <strong style='color: #e74c3c;'>ÉLŐBEN A LEVEGŐBEN!</strong>";
                    document.getElementById('countdown-wrapper').style.display = "none";
                    document.getElementById('flight-info').innerHTML = `<strong>Sebesség:</strong> ${speed} km/h<br><strong>Magasság:</strong> ${alt} méter`;

                    if (!planeMarker) {
                        planeMarker = L.marker([lat, lon], {icon: planeIcon}).addTo(map);
                        map.setView([lat, lon], 7); 
                    } else {
                        planeMarker.setLatLng([lat, lon]);
                    }
                }
            } catch (error) {
                console.error("Hiba történt:", error);
                // Csak akkor ír ki hibát, ha internet hiba van, a "gép nincs a levegőben" állapotot most már finoman kezeli
                document.getElementById('radar-status').innerHTML = '🔌 Radar kapcsolat: <span style="color: #e74c3c; font-weight: bold;">Hálózati hiba, újrakísérlés...</span>';
            }
        }

        // Frissítés 20 másodpercenként
        trackFlight();
        setInterval(trackFlight, 20000);
    </script>
</body>
</html>
