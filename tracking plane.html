<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W62362 Élő Követés</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        #status-panel {
            position: absolute;
            top: 20px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            max-width: 300px;
        }
        h3 { margin: 0 0 10px 0; color: #1a252f; }
        p { margin: 5px 0; font-size: 14px; }
    </style>
</head>
<body>

    <div id="status-panel">
        <h3>Járat: W62362</h3>
        <p id="flight-status">Kapcsolódás a radarhoz...</p>
        <p id="flight-info"></p>
    </div>

    <div id="map"></div>

    <script>
        // Térkép inicializálása Európa közepére
        const map = L.map('map').setView([47.5, 19.0], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let planeMarker = null;
        // A Wizz Air hívójelek a radarokon általában WZZ-vel kezdődnek (WZZ2362 vagy WZZ62362)
        const flightIdentifiers = ["WZZ2362", "W62362", "WZZ62362"]; 

        const planeIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/61/61212.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });

        async function trackFlight() {
            try {
                // CORS hiba megkerülése egy publikus CORS proxy használatával
                const targetUrl = 'https://opensky-network.org/api/states/all';
                const proxyUrl = 'https://cors-anywhere.herokuapp.com/'; 
                
                // Ha a fenti proxy túlterhelt, egy másik stabil alternatív proxy-t használunk (allorigins)
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
                const rawData = await response.json();
                
                // Az allorigins proxy a 'contents' kulcs alá csomagolja a választ stringként
                const data = JSON.parse(rawData.contents);
                
                if (!data || !data.states) {
                    throw new Error("Nem érkezett érvényes adat a radarról.");
                }

                // Megkeressük a járatot a listában a hívójelek alapján
                let targetFlight = data.states.find(flight => {
                    if (flight[1]) {
                        const cleanCallsign = flight[1].trim().toUpperCase();
                        return flightIdentifiers.some(id => cleanCallsign.includes(id));
                    }
                    return false;
                });

                if (targetFlight) {
                    const lat = targetFlight[6];
                    const lon = targetFlight[5];
                    const velocity = Math.round(targetFlight[9] * 3.6); // m/s -> km/h
                    const altitude = Math.round(targetFlight[7]); // méter

                    document.getElementById('flight-status').innerHTML = "🔴 <strong>ÉLŐBEN A LEVEGŐBEN</strong>";
                    document.getElementById('flight-info').innerHTML = `Sebesség: ${velocity} km/h<br>Magasság: ${altitude} m<br>Koordináta: ${lat.toFixed(4)}, ${lon.toFixed(4)}`;

                    if (!planeMarker) {
                        planeMarker = L.marker([lat, lon], {icon: planeIcon}).addTo(map);
                        map.setView([lat, lon], 7); 
                    } else {
                        planeMarker.setLatLng([lat, lon]);
                    }
                } else {
                    document.getElementById('flight-status').innerHTML = "⚪ A járat jelenleg nem repül.";
                    document.getElementById('flight-info').innerHTML = "A gép csak akkor jelenik meg a saját térképeden, ha épp a levegőben van és ad jelet.";
                    
                    if (planeMarker) {
                        map.removeLayer(planeMarker);
                        planeMarker = null;
                    }
                }
            } catch (error) {
                console.error("Hiba:", error);
                document.getElementById('flight-status').innerHTML = "⚠️ Radar adatlekérési hiba. Újrapróbálkozás...";
            }
        }

        // Futtatás indításkor, majd 45 másodpercenként
        trackFlight();
        setInterval(trackFlight, 45000);
    </script>
</body>
</html>
